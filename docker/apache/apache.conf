# ----------------------------------------------------------------------------
# Generic PHP vhost - reusable across projects.
#
# Both ${PROJECT_NAME} and ${WEB_DOCROOT} are resolved by Apache from OS
# environment variables set on the `web` service (see
# docker-compose.yml -> services.web.environment). Tune them in docker/.env:
#
#   PROJECT_NAME=myapp
#   WEB_DOCROOT=/var/www/html           # plain PHP, Yii2 advanced (root-routed)
#   WEB_DOCROOT=/var/www/html/public    # Laravel, Symfony
#   WEB_DOCROOT=/var/www/html/frontend/web  # Yii2 advanced served from frontend
# ----------------------------------------------------------------------------

# -------------------------
# HTTP
# -------------------------
<VirtualHost *:80>
    ServerName ${PROJECT_NAME}
    ServerAlias www.${PROJECT_NAME} localhost
    DocumentRoot ${WEB_DOCROOT}

    <Directory ${WEB_DOCROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Force HTTPS for the canonical project host (leave localhost on HTTP for
    # quick debugging + health-checks).
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(www\.)?${PROJECT_NAME}$ [NC]
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://${PROJECT_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/${PROJECT_NAME}_error.log
    CustomLog ${APACHE_LOG_DIR}/${PROJECT_NAME}_access.log combined
</VirtualHost>

# -------------------------
# HTTPS (self-signed cert generated by docker/setup.sh / setup.bat)
# -------------------------
<VirtualHost *:443>
    ServerName ${PROJECT_NAME}
    ServerAlias www.${PROJECT_NAME}
    DocumentRoot ${WEB_DOCROOT}

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/${PROJECT_NAME}.crt
    SSLCertificateKeyFile /etc/apache2/ssl/${PROJECT_NAME}.key
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5

    <Directory ${WEB_DOCROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/${PROJECT_NAME}_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/${PROJECT_NAME}_ssl_access.log combined
</VirtualHost>
