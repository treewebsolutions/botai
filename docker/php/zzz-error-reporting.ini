; ---------------------------------------------------------------------------
; PHP error-reporting overlay for the botai_web container.
;
; Loaded last (`zzz-` prefix in /usr/local/etc/php/conf.d/) so it wins over
; the base php.ini and any other shipped conf.d snippets. Mounted into the
; container by docker-compose.yml -> services.web.volumes, so edits here
; apply on `docker compose restart web` - no image rebuild needed.
;
; Show only true errors. PHP warnings, notices and deprecation messages
; are silenced - which also stops Yii2's ErrorHandler from converting them
; into `yii\base\ErrorException` 500s (see vendor/yiisoft/yii2/base/
; ErrorHandler.php:253, which gates the throw on `error_reporting()`).
; ---------------------------------------------------------------------------

error_reporting = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR | E_USER_ERROR | E_RECOVERABLE_ERROR

; Keep errors visible in the browser response + the apache error log during
; local dev; flip display_errors to Off when this stack is reused for a
; staging-like deployment.
display_errors         = On
display_startup_errors = On
log_errors             = On
html_errors            = On
