# ----------------------------------------------------------------------------
# phpMyAdmin vhost - exposes phpMyAdmin at both paths:
#   http://localhost:82/               (default)
#   http://localhost:82/phpmyadmin/    (Laragon-compatible URL)
# ----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Make /phpmyadmin/ resolve to the same DocumentRoot as /.
    Alias /phpmyadmin /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # So relative links that phpMyAdmin emits keep working both when accessed
    # via the root path and via the /phpmyadmin/ alias.
    <IfModule mod_rewrite.c>
        RewriteEngine On
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
