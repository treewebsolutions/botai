; PHP overrides dropped into /usr/local/etc/php/conf.d/ by docker-compose.
; Purpose: make phpMyAdmin imports/exports behave on large SQL dumps.

memory_limit = 1024M
max_execution_time = 0
max_input_time = 600
upload_max_filesize = 1024M
post_max_size = 1024M

; Disable output compression so the browser renders results progressively
; (noticeable on large SELECTs in PMA).
zlib.output_compression = Off
